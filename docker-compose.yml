services:
  postgres:
    image: postgres:16-alpine
    container_name: roomfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomfolio_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roomfolio_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: roomfolio_postgres_data
